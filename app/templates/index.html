<!DOCTYPE html>
<html>
<head>
    <title>PriorityPilot</title>
</head>

<body>

    <h1>PriorityPilot</h1>
    <p>Smart task prioritization assistant</p>

    <h2>Add a Task</h2>

    <form id="taskForm">

        <label>Task Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Deadline:</label>
        <input type="text" id="deadline" placeholder="Today / Tomorrow / This week" required>
        <br><br>

        <label>Estimated Hours:</label>
        <input type="number" id="hours" step="0.5" required>
        <br><br>

        <label>Importance:</label>
        <select id="importance">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>
        <br><br>

        <label>Difficulty:</label>
        <select id="difficulty">
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
        </select>
        <br><br>

        <button type="submit">Prioritize Task</button>

    </form>

    <div id="result"></div>

</body>
</html>
